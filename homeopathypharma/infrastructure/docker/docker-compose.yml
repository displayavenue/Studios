# HomeopathyPharma local development stack
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# Or:    pnpm docker:up

name: homeopathypharma

services:
  postgres:
    image: postgres:16-alpine
    container_name: hp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hp
      POSTGRES_PASSWORD: hp_dev_password
      POSTGRES_DB: homeopathypharma
    ports:
      - "5432:5432"
    volumes:
      - hp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp -d homeopathypharma"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: hp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - hp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: hp-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - hp_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: hp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: hp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio_secret &&
      mc mb --ignore-existing local/homeopathypharma &&
      mc anonymous set download local/homeopathypharma/public &&
      echo 'MinIO bucket homeopathypharma ready'
      "
    restart: "no"

volumes:
  hp_postgres_data:
  hp_redis_data:
  hp_opensearch_data:
  hp_minio_data:
