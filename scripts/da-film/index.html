<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DisplayAvenue - Complete Digital Partner</title>
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; src: url("./assets/PlusJakartaSans-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("./assets/PlusJakartaSans-SemiBold.ttf") format("truetype"); font-weight: 600; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("./assets/PlusJakartaSans-Bold.ttf") format("truetype"); font-weight: 700; }
    @font-face { font-family: "Sora"; src: url("./assets/Sora-SemiBold.ttf") format("truetype"); font-weight: 600; }
    @font-face { font-family: "Sora"; src: url("./assets/Sora-Bold.ttf") format("truetype"); font-weight: 700; }

    :root {
      --navy: #0B1F3A;
      --navy-2: #102a4d;
      --blue: #0056ff;
      --blue-soft: #3d7cff;
      --sky: #e8f0ff;
      --white: #ffffff;
      --ink: #0f172a;
      --muted: rgba(255,255,255,0.78);
      --gold: #f5b942;
      --ok: #22c55e;
      --bad: #ef4444;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden; cursor: none;
      background: var(--navy); color: var(--white);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .stage { position: relative; width: 1920px; height: 1080px; background: var(--navy); }

    .bg-mesh {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(0,86,255,0.35), transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(61,124,255,0.22), transparent 45%),
        linear-gradient(145deg, #071526 0%, #0B1F3A 45%, #0e2748 100%);
    }
    .bg-mesh::after {
      content: ""; position: absolute; inset: -20%;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      animation: drift 40s linear infinite;
      opacity: 0.5;
    }
    @keyframes drift { to { transform: translate(-64px, -64px); } }

    .orb {
      position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.45;
      animation: float 8s ease-in-out infinite alternate;
    }
    .orb.a { width: 420px; height: 420px; background: #0056ff; top: -80px; right: 120px; }
    .orb.b { width: 320px; height: 320px; background: #3d7cff; bottom: 40px; left: 80px; animation-delay: -3s; }
    @keyframes float { to { transform: translate(30px, -24px) scale(1.08); } }

    .chrome {
      position: absolute; z-index: 20; left: 72px; right: 72px; top: 36px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55);
    }
    .logo {
      font-family: "Sora", sans-serif; font-weight: 700; font-size: 28px;
      letter-spacing: 0; text-transform: none; color: #fff;
    }
    .logo span { color: #3d7cff; }
    .chapter-tag {
      padding: 8px 16px; border: 1px solid rgba(61,124,255,0.45);
      border-radius: 999px; background: rgba(0,86,255,0.15); color: #cfe0ff;
      letter-spacing: 0.08em; font-size: 13px;
    }

    .slide {
      position: absolute; inset: 0; opacity: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: center;
      padding: 120px 100px 100px;
      z-index: 5;
    }
    .slide.active { opacity: 1; }

    .eyebrow {
      font-size: 18px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: #8eb6ff; margin-bottom: 18px; opacity: 0; transform: translateY(18px);
    }
    .title {
      font-family: "Sora", sans-serif; font-weight: 700;
      font-size: 64px; line-height: 1.12; max-width: 1400px;
      margin-bottom: 22px; opacity: 0; transform: translateY(28px);
    }
    .title.lg { font-size: 76px; }
    .title.sm { font-size: 52px; }
    .lead {
      font-size: 28px; line-height: 1.45; color: var(--muted); max-width: 1200px;
      font-weight: 400; opacity: 0; transform: translateY(22px);
    }
    .lead strong { color: #fff; font-weight: 600; }

    .slide.active .eyebrow { animation: rise 0.7s var(--ease) 0.15s forwards; }
    .slide.active .title { animation: rise 0.85s var(--ease) 0.28s forwards; }
    .slide.active .lead,
    .slide.active .cards,
    .slide.active .stats,
    .slide.active .chips,
    .slide.active .steps,
    .slide.active .quote,
    .slide.active .cta-row,
    .slide.active .flow,
    .slide.active .pain-grid,
    .slide.active .logo-wall { animation: rise 0.9s var(--ease) 0.48s forwards; }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;
      margin-top: 48px; max-width: 1500px; opacity: 0; transform: translateY(24px);
    }
    .stat {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 28px 24px; backdrop-filter: blur(8px);
    }
    .stat b {
      display: block; font-family: "Sora", sans-serif; font-size: 48px; color: #7eb0ff;
      margin-bottom: 8px; line-height: 1;
    }
    .stat span { font-size: 16px; color: rgba(255,255,255,0.7); letter-spacing: 0.04em; }

    .chips {
      display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px;
      max-width: 1400px; opacity: 0; transform: translateY(24px);
    }
    .chip {
      padding: 12px 18px; border-radius: 999px; font-size: 18px; font-weight: 600;
      background: rgba(0,86,255,0.18); border: 1px solid rgba(125,176,255,0.35); color: #e8f0ff;
    }

    .cards {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
      margin-top: 40px; max-width: 1600px; opacity: 0; transform: translateY(24px);
    }
    .card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 28px; min-height: 180px;
    }
    .card h3 { font-family: "Sora", sans-serif; font-size: 26px; margin-bottom: 12px; }
    .card p { font-size: 18px; line-height: 1.45; color: var(--muted); }
    .card .you {
      display: inline-block; margin-top: 14px; font-size: 15px; font-weight: 700;
      color: #f5b942; letter-spacing: 0.04em; text-transform: uppercase;
    }

    .pain-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      margin-top: 36px; max-width: 1500px; opacity: 0; transform: translateY(24px);
    }
    .pain, .gain {
      border-radius: 18px; padding: 22px 26px; font-size: 22px; line-height: 1.4;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .pain { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); }
    .gain { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.35); }
    .pain i, .gain i { font-style: normal; font-weight: 800; margin-top: 2px; }
    .pain i { color: #fca5a5; }
    .gain i { color: #86efac; }

    .steps {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
      margin-top: 40px; opacity: 0; transform: translateY(24px);
    }
    .step {
      position: relative; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 26px;
      min-height: 220px;
    }
    .step.active-step {
      border-color: rgba(61,124,255,0.8);
      box-shadow: 0 0 0 1px rgba(0,86,255,0.35), 0 20px 50px rgba(0,86,255,0.2);
      background: rgba(0,86,255,0.18);
    }
    .step .num {
      font-family: "Sora", sans-serif; font-size: 14px; letter-spacing: 0.14em;
      color: #8eb6ff; margin-bottom: 14px;
    }
    .step h3 { font-family: "Sora", sans-serif; font-size: 26px; margin-bottom: 12px; }
    .step p { font-size: 17px; color: var(--muted); line-height: 1.45; }

    .flow {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      margin-top: 40px; max-width: 1600px; opacity: 0; transform: translateY(24px);
    }
    .flow .node {
      padding: 14px 20px; border-radius: 12px; background: #fff; color: var(--navy);
      font-weight: 700; font-size: 18px;
      animation: pulseNode 2.4s ease-in-out infinite;
    }
    .flow .node:nth-child(odd) { animation-delay: 0.2s; }
    .flow .arrow { color: #8eb6ff; font-size: 24px; font-weight: 700; }
    @keyframes pulseNode {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .quote {
      margin-top: 36px; max-width: 1300px; opacity: 0; transform: translateY(24px);
      background: rgba(255,255,255,0.06); border-left: 5px solid #3d7cff;
      border-radius: 0 18px 18px 0; padding: 28px 32px;
    }
    .quote p { font-size: 28px; line-height: 1.45; font-weight: 500; margin-bottom: 16px; }
    .quote cite { font-style: normal; color: #8eb6ff; font-size: 18px; }

    .logo-wall {
      display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px;
      opacity: 0; transform: translateY(24px);
    }
    .logo-wall span {
      padding: 14px 22px; border-radius: 12px; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14); font-weight: 700; font-size: 18px;
    }

    .cta-row {
      display: flex; gap: 18px; align-items: center; margin-top: 42px;
      opacity: 0; transform: translateY(24px);
    }
    .btn {
      background: #0056ff; color: #fff; font-weight: 700; font-size: 20px;
      padding: 18px 32px; border-radius: 14px; letter-spacing: 0.02em;
      box-shadow: 0 16px 40px rgba(0,86,255,0.35);
    }
    .cta-meta { font-size: 22px; color: rgba(255,255,255,0.85); }

    .caption {
      position: absolute; z-index: 30; left: 100px; right: 100px; bottom: 56px;
      background: rgba(7, 21, 38, 0.72); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 16px 22px; font-size: 22px; line-height: 1.4;
      color: rgba(255,255,255,0.92); min-height: 64px;
      backdrop-filter: blur(10px);
    }

    .progress {
      position: absolute; z-index: 40; left: 0; right: 0; bottom: 0; height: 6px;
      background: rgba(255,255,255,0.1);
    }
    .progress > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #0056ff, #7eb0ff);
    }

    .client-badge {
      position: absolute; z-index: 25; right: 72px; bottom: 140px;
      padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(245,185,66,0.15); border: 1px solid rgba(245,185,66,0.45); color: #ffe4a3;
    }

    .two-col {
      display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: center;
      margin-top: 8px;
    }
    .visual-panel {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px; padding: 28px; min-height: 420px;
      position: relative; overflow: hidden;
    }
    .visual-panel .fake-ui {
      background: #fff; color: var(--ink); border-radius: 16px; padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      animation: uiIn 0.9s var(--ease) both;
    }
    @keyframes uiIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } }
    .fake-ui .bar { height: 12px; background: #e2e8f0; border-radius: 8px; margin-bottom: 12px; }
    .fake-ui .bar.short { width: 55%; }
    .fake-ui .metric {
      display: flex; justify-content: space-between; padding: 14px 0;
      border-bottom: 1px solid #eef2f7; font-size: 16px; font-weight: 600;
    }
    .fake-ui .metric em { font-style: normal; color: #16a34a; }
    .ring {
      width: 220px; height: 220px; margin: 40px auto 0; border-radius: 50%;
      border: 8px solid rgba(0,86,255,0.25); border-top-color: #0056ff;
      animation: spin 3.5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ring-label {
      text-align: center; margin-top: -130px; font-family: "Sora", sans-serif;
      font-size: 28px; font-weight: 700;
    }

    .end-card { text-align: center; align-items: center; }
    .end-card .title { max-width: none; }
    .end-card .lead { max-width: 1000px; margin: 0 auto; }

    .fade { position: absolute; inset: 0; z-index: 50; background: #071526; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

    <div class="fade" id="fade"></div>
  </div>

  <script>

      "id": "05_pain",

    },

      "visualDuration": 23.784
    },
    {

      "visualDuration": 18.816

    {
      "id": "10_optimize",
      "chapter": "How we work",
      "title": "Step 4 - Optimize and Scale",

    },
    {
      "id": "12_digital_marketing",

      "text": "And because growth needs storytelling: photography, videography, drone, product shoots, brand films, animation, motion graphics, and editing. Creative that feeds your ads, website, social, and sales - produced by the same company running your funnel. That is what three-hundred-sixty degree looks like.",

    function buildSlides(segments) {
      const root = document.getElementById("slides");
      root.innerHTML = "";
      segments.forEach((seg, idx) => {
        const ui = SCENE_UI[seg.id] || { title: seg.title, lead: "", eyebrow: seg.chapter, caption: seg.title };
        const el = document.createElement("section");
        el.className = "slide" + (ui.end ? " end-card" : "");
        el.dataset.id = seg.id;
        el.dataset.index = String(idx);
        const processClone = (ui.highlightStep !== undefined)
          ? `<div class="steps">${[0,1,2,3].map((i) => {
              const names = ["Discover","Plan","Build & Launch","Optimize & Scale"];
              const descs = [
                "Audit presence, competitors, leaks.",
                "Goals, messaging, timeline, KPIs.",
                "Ship with tracking & quality checks.",
                "Improve conversion and scale winners."
              ];
              return `<div class="step ${i===ui.highlightStep?"active-step":""}"><div class="num">STEP 0${i+1}</div><h3>${names[i]}</h3><p>${descs[i]}</p></div>`;
            }).join("")}</div>`
          : (ui.extra || "");
        el.innerHTML = `
          <div class="eyebrow">${ui.eyebrow || seg.chapter}</div>
          <h1 class="title ${ui.end ? "lg" : ""}">${ui.title || seg.title}</h1>
          <p class="lead">${ui.lead || ""}</p>
          ${processClone}
        `;
        el.dataset.caption = ui.caption || seg.title;
        root.appendChild(el);
      });
    }

    function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

    async function play(timeline) {
      const slides = [...document.querySelectorAll(".slide")];
      const fade = document.getElementById("fade");
      const caption = document.getElementById("caption");
      const chapterTag = document.getElementById("chapterTag");
      const bar = document.getElementById("progressBar");
      const total = timeline.totalVisualSeconds;
      let elapsed = 0;

      document.body.dataset.ready = "1";
      for (let i = 0; i < slides.length; i++) {
        const seg = timeline.segments[i];
        slides.forEach((s, n) => s.classList.toggle("active", n === i));
        chapterTag.textContent = seg.chapter;
        caption.textContent = slides[i].dataset.caption || seg.title;
        fade.style.transition = "opacity 350ms ease";
        fade.style.opacity = "0";

        const dur = seg.visualDuration * 1000;
        const start = performance.now();
        while (performance.now() - start < dur - 350) {
          const local = (performance.now() - start) / dur;
          const global = (elapsed + (performance.now() - start) / 1000) / total;
          bar.style.width = `${Math.min(100, global * 100)}%`;
          await wait(40);
        }
        elapsed += seg.visualDuration;
        if (i < slides.length - 1) {
          fade.style.opacity = "1";
          await wait(350);
        }
      }
      bar.style.width = "100%";
      document.body.dataset.done = "1";
    }

    async function boot() {
      try {
        const res = await fetch("./timeline.json");
        TIMELINE = await res.json();
      } catch (e) {
        TIMELINE = EMBEDDED_TIMELINE;
      }
      if (!TIMELINE) TIMELINE = EMBEDDED_TIMELINE;
      buildSlides(TIMELINE.segments);
      const params = new URLSearchParams(location.search);
      const delay = Number(params.get("delay") || 1500);
      window.__film = { play: () => play(TIMELINE), timeline: TIMELINE };
      window.addEventListener("load", () => setTimeout(() => play(TIMELINE), delay));
    }
    boot();
  </script>
