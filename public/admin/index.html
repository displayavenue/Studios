<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>DisplayAvenue CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css?v=20260805c" />
</head>
<body>
  <div id="app">
    <section id="login-view" class="login-view">
      <div class="login-card">
        <div class="logo">DA</div>
        <h1>DisplayAvenue CMS</h1>
        <p>Sign in to edit website content, images, prices and pages.</p>
        <form id="login-form">
          <label for="password">Admin password</label>
          <input id="password" type="password" autocomplete="current-password" required placeholder="Enter password" />
          <button type="submit" class="btn btn-gold">Sign in</button>
          <p id="login-error" class="error" hidden></p>
        </form>
        <p class="hint">Default password is in <code>admin/config.php</code> — change it after first login.</p>
      </div>
    </section>

    <section id="cms-view" class="cms-view" hidden>
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="logo">DA</span>
          <div>
            <strong>DisplayAvenue</strong>
            <small>Content Manager</small>
          </div>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-foot">
          <a href="/" target="_blank" rel="noreferrer">View website ↗</a>
          <button type="button" id="logout-btn" class="btn btn-ghost">Log out</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="panel-title">Dashboard</h2>
            <p id="panel-sub">Choose a section to edit.</p>
          </div>
          <div class="topbar-actions">
            <button type="button" id="reload-btn" class="btn btn-ghost">Reload</button>
            <button type="button" id="save-btn" class="btn btn-gold" disabled>Save changes</button>
          </div>
        </header>

        <div id="toast" class="toast" hidden></div>

        <div id="editor-wrap" class="editor-wrap">
          <p class="empty">Select a collection from the left.</p>
        </div>
      </main>
    </section>
  </div>
  <script src="admin.js?v=20260805c"></script>
</body>
</html>
