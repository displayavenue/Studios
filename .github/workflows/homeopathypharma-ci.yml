name: HomeopathyPharma CI

on:
  push:
    branches: [main, master, develop, "cursor/**"]
    paths:
      - "homeopathypharma/**"
      - ".github/workflows/homeopathypharma-ci.yml"
  pull_request:
    paths:
      - "homeopathypharma/**"
      - ".github/workflows/homeopathypharma-ci.yml"

defaults:
  run:
    working-directory: homeopathypharma

concurrency:
  group: hp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, sqlite, zip, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: homeopathypharma/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('homeopathypharma/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: homeopathypharma/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite

      - name: Test
        run: php artisan test

      - name: Build assets
        run: npm run build
